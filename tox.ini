[tox]
no_package = True
skip_missing_interpreters = True
env_list = fmt,lint,static,unit
min_version = 4.0.0

[vars]
src = {tox_root}/src
tests = {tox_root}/tests
all_path = {[vars]src} {[vars]tests}
uv_flags = --frozen --isolated

[testenv]
allowlist_externals = uv
set_env =
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1

[testenv:fmt]
description = Format code with ruff
commands =
    uv run {[vars]uv_flags} ruff format {[vars]all_path}

[testenv:lint]
description = Lint code with ruff
commands =
    uv run {[vars]uv_flags} ruff check {[vars]all_path}

[testenv:static]
description = Run static type checking with ty
commands =
    uv run {[vars]uv_flags} ty check {[vars]src}

[testenv:unit]
description = Run unit tests with coverage
commands =
    uv run {[vars]uv_flags} pytest {[vars]tests} -v --cov={[vars]src}/theow --cov-report=term-missing
