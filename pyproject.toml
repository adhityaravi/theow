[project]
name = "theow"
dynamic = ["version"]
description = "LLM-in-the-loop rule based expert system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chromadb>=0.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "google-genai>=0.3",
    "anthropic>=0.40",
    "github-copilot-sdk>=0.1",
    "pydantic-ai>=1.0",
    "logfire>=3.0",
    "pydantic-ai-guardrails>=0.1",
    "rich>=13.0",
    "structlog>=24.0",
    "typer>=0.12",
]

[project.scripts]
theow = "theow._cli:app"

[project.optional-dependencies]
daemon = [
    # Future: trio, httpx, etc. for server mode
]
codegraph = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-go>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "ty>=0.0.15",
    "tox>=4.0",
    "tox-uv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/theow/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/theow"]

[tool.ty.src]
exclude = ["src/theow/_codegraph/examples/"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/theow/_codegraph/examples/"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
fail_under = 85
